# Edge: serves the UI and load-balances the API across gateway replicas (same origin, no CORS).
events { worker_connections 8192; }

http {
    include /etc/nginx/mime.types;
    access_log off;

    upstream gateway {
        # Docker DNS returns one A record per `api` replica; nginx round-robins across them.
        # It resolves at startup, so restart nginx after scaling (loadtest/run.py does).
        # Open-source nginx only has passive health checks: a replica that refuses connections
        # is skipped for fail_timeout.
        server api:8000 max_fails=1 fail_timeout=5s;
        keepalive 256;
        # Must be SHORTER than the gateway's idle keep-alive (uvicorn --timeout-keep-alive 75),
        # so nginx never sends a request on a connection the gateway just closed. With uvicorn's
        # default (5s) that race produced "connection reset" 502s, which nginx can't safely retry
        # for a POST.
        keepalive_timeout 60s;
    }

    server {
        listen 8000;

        # API
        location ~ ^/(v1|admin|demo|healthz|readyz|metrics)(/|$) {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # SSE: pass chunks through immediately.
            proxy_buffering off;
            proxy_read_timeout 300s;
            # Fail over fast when a replica's IP stops answering (stopped container). The
            # default is 60s, longer than most clients wait; on a LAN 1s is plenty.
            proxy_connect_timeout 1s;
            # Try another replica only if the request never reached this one (connect error).
            # nginx never re-sends a POST that was already sent, so no double-billing.
            proxy_next_upstream error timeout;
        }

        # UI: hashed assets are immutable; everything else falls back to the single-page app.
        root /usr/share/nginx/html;
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
