[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway with auth, limits, caching, failover and cost tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "prometheus-client>=0.20",
    # Not imported by us: httpx/httpcore call `import sniffio` on every connection-pool
    # operation and fall back to asyncio when it's missing. Each failed import scans sys.path
    # on disk; profiling found that cost ~5 ms of CPU per request under load.
    "sniffio>=1.3",
]

[project.optional-dependencies]
# Smart routing (`model: "auto"`): prompt embeddings on CPU at request time.
# torch is listed directly: uv applies [tool.uv.sources] (the CPU wheel index) only to
# direct dependencies, so as a transitive dep it silently resolved to the ~5 GB CUDA build.
router = ["sentence-transformers>=3.0", "torch>=2.4"]
# Traffic capture to Kafka (distillation, M5+). Only imported when CAPTURE_ENABLED=true.
capture = ["aiokafka>=0.11"]

[dependency-groups]
# Offline routing evaluation: dataset labelling, classifier training, cost/quality curves.
eval = ["scikit-learn>=1.5"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "openai>=1.40",
]
# Offline distillation pipeline: capture consumer (Kafka -> Postgres + Parquet), replayer,
# discovery, dataset builder, eval. Never imported by the gateway itself.
distill = ["aiokafka>=0.11", "pyarrow>=17"]

[tool.uv]
default-groups = ["dev"]

# CPU-only PyTorch for sentence-transformers (the default wheel bundles ~2 GB of CUDA).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF", "N"]
# Error class names come from the spec (RateLimited, BadRequest, ...), not "...Error".
ignore = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["gateway", "tests", "scripts", "eval", "distill", "loadtest/profile_capture.py"]

[[tool.mypy.overrides]]
module = [
    "tiktoken.*", "respx.*", "torch.*", "sentence_transformers.*", "sklearn.*", "numpy.*",
    "aiokafka.*", "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs docker Redis/Postgres"]
addopts = "-m 'not integration'"
